<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>클릭 이벤트 등록하기</title>
    
</head>
<body>
<div id="map" style="width:100%;height:600px;"></div>
<p id="result"></p>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0da54378e842829a12d7cb6a4c53a524&libraries=services"></script>
<script>
var mapContainer = document.getElementById('map'), // 지도를 표시할 div 
    mapOption = { 
        center: new kakao.maps.LatLng(35.14479149244142, 129.0098113513206), // 지도의 중심좌표
        level: 3 // 지도의 확대 레벨
    };

var map = new kakao.maps.Map(mapContainer, mapOption); // 지도를 생성합니다

// 지도에 클릭 이벤트를 등록합니다
// 지도를 클릭하면 마지막 파라미터로 넘어온 함수를 호출합니다
// 다각형을 구성할 좌표 배열
var polygonPath = [];

// 지도에 표시할 다각형 생성
var polygon = new kakao.maps.Polygon({
    map: map,
    path: polygonPath,
    strokeWeight: 3,
    strokeColor: '#FF0000',
    strokeOpacity: 0.8,
    fillColor: '#FF0000',
    fillOpacity: 0.4
});

kakao.maps.event.addListener(map, 'click', function(mouseEvent) {        

    // 클릭한 좌표
    var latlng = mouseEvent.latLng;
    var lat = latlng.getLat();
    var lng = latlng.getLng();

    // 경로 배열에 추가
    polygonPath.push(latlng);

    // 다각형 경로 갱신
    polygon.setPath(polygonPath);

    // 출력 형식
    var message = 'new kakao.maps.LatLng(' + lat + ', ' + lng + '),';

    // 아래에 누적 출력
    var resultDiv = document.getElementById('result'); 
    resultDiv.innerHTML += message + '<br>';

});

</script>
</body>
</html>
