<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>카카오 지도 버튼 클릭 시 하단 정보 표시</title>
    
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=0da54378e842829a12d7cb6a4c53a524&libraries=services"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        
        #map { 
            width: 100%; 
            height: 600px; /* 지도의 높이 설정 */
        }
        
        #button-container {
            padding: 10px;
            background-color: #f8f8f8;
            border-bottom: 1px solid #ddd;
            display: flex; /* 버튼을 가로로 정렬 */
            flex-wrap: wrap; /* 버튼이 많으면 다음 줄로 넘어가게 설정 */
            gap: 5px; /* 버튼 사이 간격 */
        }
        
        #button-container button {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 4px;
            font-size: 13px;
            transition: background-color 0.1s;
        }
        
        #button-container button:hover {
            background-color: #e6e6e6;
        }
        
        #info-display {
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #007bff;
            background-color: #eaf5ff;
            font-size: 1.2em;
            font-weight: bold;
            color: #007bff;
            text-align: center;
            /* 초기에는 숨김 */
            display: none; 
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="button-container">
        </div>
    <div id="info-display">
        </div>

    <script>
        // 지도 관련 변수 및 상수
        let mapContainer = document.getElementById('map');
        let mapOption = {
            center: new kakao.maps.LatLng(35.1450, 129.0095), 
            level: 3 
        };
        let map = new kakao.maps.Map(mapContainer, mapOption);
        let infowindow = new kakao.maps.InfoWindow({zIndex: 1});
        let polygons = {}; 
        
        const infoDisplay = document.getElementById('info-display');
        const DEFAULT_FILL_COLOR = '#6B8EE6';
        const HIGHLIGHT_FILL_COLOR = '#FF5555';
        const DEFAULT_FILL_OPACITY = 0.4;
        const HIGHLIGHT_FILL_OPACITY = 0.6;


        // 1. JSON 데이터 불러오기
        fetch('area_polygons.json') 
            .then(response => {
                if (!response.ok) {
                    throw new Error('JSON 파일 로드 오류: 상태 코드 ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                drawPolygons(data); // 다각형 생성
                createBuildingButtons(data); // 버튼 생성
            })
            .catch(error => {
                console.error('Error loading JSON:', error);
                infoDisplay.style.display = 'block';
                infoDisplay.textContent = '데이터 로드 오류! 웹 서버 환경에서 실행 중인지 확인하세요.';
            });

        // 2. 다각형(Polygon) 생성 및 지도 이벤트 등록
        function drawPolygons(areaData) {
            areaData.forEach(area => {
                let polygonPath = area.paths.map(coord =>
                    new kakao.maps.LatLng(coord.lat, coord.lng)
                );

                let polygon = new kakao.maps.Polygon({
                    path: polygonPath,
                    strokeWeight: 3,
                    strokeColor: '#3978C1',
                    strokeOpacity: 0.8,
                    fillColor: DEFAULT_FILL_COLOR,
                    fillOpacity: DEFAULT_FILL_OPACITY
                });

                polygon.setMap(map);
                polygons[area.id] = polygon; 

                // 마우스 이벤트 (다각형에 직접 이벤트 등록)
                kakao.maps.event.addListener(polygon, 'mouseover', function() {
                    highlightPolygon(polygon);
                    infoDisplay.style.display = 'block';
                    infoDisplay.textContent = `마우스 오버: ${area.name}`;
                });
                
                kakao.maps.event.addListener(polygon, 'mouseout', function() {
                    resetPolygon(polygon);
                    infoDisplay.style.display = 'none';
                    infowindow.close();
                });
                
                // 클릭 이벤트는 버튼 클릭과 동일하게 처리하도록 통합
                kakao.maps.event.addListener(polygon, 'click', function() {
                    handleMapAction(area);
                });
            });
        }
        
        // 3. 버튼 생성 및 클릭 이벤트 등록
        function createBuildingButtons(areaData) {
            const buttonContainer = document.getElementById('button-container');
            
            areaData.forEach(area => {
                const button = document.createElement('button');
                button.textContent = area.name; // 버튼에 건물 이름 표시
                
                button.onclick = function() {
                    handleMapAction(area);
                };
                
                buttonContainer.appendChild(button);
            });
        }

        // 4. 버튼/다각형 클릭 시 공통 동작 (지도 이동, 강조, 하단 정보 표시)
        function handleMapAction(area) {
            const polygon = polygons[area.id];
            
            if (polygon) {
                // 1. 강조 표시 및 리셋
                highlightPolygon(polygon);

                // 2. 지도 이동 (다각형의 중심 좌표를 계산하여 이동)
                let bounds = new kakao.maps.LatLngBounds();
                area.paths.forEach(coord => {
                    bounds.extend(new kakao.maps.LatLng(coord.lat, coord.lng));
                });
                let center = bounds.getCenter();
                map.panTo(center); 

                // 3. 하단 영역에 건물 이름 표시
                infoDisplay.style.display = 'block';
                infoDisplay.textContent = `선택된 건물: ${area.name}`;
                
                // 인포윈도우는 버튼 클릭 시 숨김 (선택 사항)
                infowindow.close(); 
            }
        }
        
        // 5. 다각형 강조 및 리셋 함수
        function highlightPolygon(targetPolygon) {
            // 모든 다각형의 강조 해제
            for(let id in polygons) {
                resetPolygon(polygons[id]);
            }
            // 목표 다각형 강조
            targetPolygon.setOptions({
                fillColor: HIGHLIGHT_FILL_COLOR, 
                fillOpacity: HIGHLIGHT_FILL_OPACITY
            });
        }
        
        function resetPolygon(polygon) {
            polygon.setOptions({
                fillColor: DEFAULT_FILL_COLOR, 
                fillOpacity: DEFAULT_FILL_OPACITY
            });
        }
        
    </script>
</body>
</html>
