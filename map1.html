<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>카카오 지도 다각형 영역 표시 및 이벤트</title>
    
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0da54378e842829a12d7cb6a4c53a524&libraries=services"></script>
    
    <style>
        #map {
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. 지도 생성
        let mapContainer = document.getElementById('map');
        let mapOption = {
            // 중심 좌표: 대략적인 대학교 중앙 위치 (동의과학대학교 근처)
            center: new kakao.maps.LatLng(35.1450, 129.0095), 
            level: 3 // 확대 레벨
        };
        let map = new kakao.maps.Map(mapContainer, mapOption);
        
        // 인포윈도우 객체를 미리 하나 생성해 재활용합니다.
        let infowindow = new kakao.maps.InfoWindow({zIndex: 1});

        // 2. JSON 데이터 불러오기
        fetch('area_polygons.json') 
            .then(response => {
                if (!response.ok) {
                    throw new Error('JSON 파일 로드 오류: 파일 경로를 확인하세요.');
                }
                return response.json();
            })
            .then(data => {
                drawPolygons(data);
            })
            .catch(error => console.error('Error loading JSON:', error));

        // 3. 다각형(Polygon) 생성 및 이벤트 등록 함수
        function drawPolygons(areaData) {
            areaData.forEach(area => {
                // 좌표를 kakao.maps.LatLng 객체 배열로 변환
                let polygonPath = area.paths.map(coord =>
                    new kakao.maps.LatLng(coord.lat, coord.lng)
                );

                // 다각형 객체 생성 (기본 스타일)
                let polygon = new kakao.maps.Polygon({
                    path: polygonPath,
                    strokeWeight: 3,
                    strokeColor: '#3978C1',
                    strokeOpacity: 0.8,
                    fillColor: '#6B8EE6',
                    fillOpacity: 0.4 // 초기 투명도
                });

                // 다각형을 지도에 표시
                polygon.setMap(map);

                // =======================================================
                // 4. 이벤트 등록
                // =======================================================

                // A. 클릭 이벤트: 인포윈도우 표시
                kakao.maps.event.addListener(polygon, 'click', function(mouseEvent) {
                    let content = `<div style="padding:5px;font-size:12px;">**${area.name}**</div>`;
                    
                    // 마우스 클릭 위치에 인포윈도우 표시
                    infowindow.setContent(content);
                    infowindow.setPosition(mouseEvent.latLng);
                    infowindow.open(map);
                });
                
                // B. 마우스 오버 이벤트: 색상 변경
                kakao.maps.event.addListener(polygon, 'mouseover', function() {
                    polygon.setOptions({
                        fillColor: '#FF5555', // 빨간색 계열로 변경
                        fillOpacity: 0.6
                    });
                });
                
                // C. 마우스 아웃 이벤트: 원래 색상으로 복귀
                kakao.maps.event.addListener(polygon, 'mouseout', function() {
                    polygon.setOptions({
                        fillColor: '#6B8EE6', // 원래 색상으로 복귀
                        fillOpacity: 0.4
                    });
                    // 마우스가 영역을 벗어날 때 인포윈도우 닫기
                    infowindow.close();
                });
            });
        }
    </script>
</body>
</html>
